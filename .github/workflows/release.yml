name: Release

# Cut a release by pushing a tag: `git push origin main vX.Y.Z`
# (use `pnpm release X.Y.Z` to bump + tag for you). The matrix builds and signs
# on each OS and uploads to one GitHub Release (created up front), and the
# final job pushes the generated latest.json to the updater gist.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Create the release once, before the matrix. Left to tauri-action, each
  # platform job looks the release up and creates it if missing, so parallel
  # jobs raced and v1.3.0 ended up as two releases with the Windows assets and
  # its updater entries on the hidden one. Re-running the workflow reuses it.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Sarala $TAG" \
              --notes "See the assets below to download and install this version."
          fi
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # universal (Apple Silicon + Intel)
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04 # AppImage
            args: ""
          - platform: windows-latest # NSIS .exe
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # The GitHub-hosted ubuntu-22.04 image ships Microsoft/Azure apt repos
          # whose InRelease signatures intermittently break and fail the whole
          # `apt-get update` with exit 100 (this sank the v0.4.0 Linux build). We
          # don't need them, so remove them before updating.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/microsoft.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libappindicator3-dev \
            libwayland-dev \
            libasound2-dev \
            libopenblas-dev \
            cmake \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Link clang's runtime for ggml's Metal @available checks (macOS only)
        if: matrix.platform == 'macos-latest'
        # rustc links with -nodefaultlibs, so libclang_rt.osx.a (which provides
        # ___isPlatformVersionAtLeast, the helper @available(macOS 15.0, ...)
        # checks in ggml-metal-device.m compile down to) isn't linked by
        # default, unlike a normal Xcode-driven build. Confirmed locally: a
        # release build fails to link without this, succeeds with it.
        run: echo "RUSTFLAGS=-C link-arg=$(clang -print-file-name=libclang_rt.osx.a)" >> "$GITHUB_ENV"

      - name: Build, sign, and upload to the GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign). Set these as repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (Developer ID) and notarization. tauri-action
          # imports the certificate into a temporary keychain, and
          # APPLE_SIGNING_IDENTITY overrides the ad-hoc "-" in tauri.conf.json,
          # which local builds keep. The other platforms ignore these.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Voice typing's speech engine (ggml) would otherwise be tuned to this
          # runner's CPU and crash on older machines. Portable baseline: x86-64
          # with AVX2/FMA/F16C (2013+; the app checks at runtime and explains if
          # missing). The x86 flags are ignored for Apple Silicon.
          # CMAKE_OSX_DEPLOYMENT_TARGET: ggml's macOS backend code uses
          # std::filesystem, unavailable before 10.15 — without it, Clang
          # assumes an older default minimum and the universal (Intel + Apple
          # Silicon) build fails to compile. transcribe-cpp-sys's build.rs
          # reads TRANSCRIBE_CMAKE_ARGS directly (confirmed locally: a bare
          # MACOSX_DEPLOYMENT_TARGET env var does NOT reach its cmake::Config);
          # ignored by CMake on non-Apple platforms, so harmless on Linux/Windows.
          # BLA_VENDOR (Linux): the speech decoder calls cblas_sgemv. Left to
          # probe, CMake linked whatever libblas.so.3 the runner had, which the
          # .deb didn't declare and which Arch/Fedora's reference BLAS doesn't
          # export (CBLAS is a separate library there). libopenblas.so.0 always
          # has CBLAS and exists under that name on every major distro.
          TRANSCRIBE_CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15${{ matrix.platform == 'ubuntu-22.04' && ' -DBLA_VENDOR=OpenBLAS' || '' }}"
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}

      # The packages must only need libraries they declare. Runs after upload,
      # but a failure here still blocks update-gist, so no updater feed points
      # installs at a broken build.
      - name: Check the Linux packages' library dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          bin=src-tauri/target/release/sarala
          needed=$(readelf -d "$bin" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')
          echo "$needed"
          echo "$needed" | grep -qx libopenblas.so.0 \
            || { echo "::error::sarala doesn't link libopenblas.so.0 (voice decoding falls back to a slow loop)"; exit 1; }
          if echo "$needed" | grep -qx libblas.so.3; then
            echo "::error::sarala links libblas.so.3, which the packages don't declare"; exit 1
          fi
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
          dpkg-deb -f "$deb" Depends | tee /dev/stderr | grep -q libopenblas0
          dpkg-deb --fsys-tarfile "$deb" | tar -xO --wildcards '*usr/share/applications/*.desktop' | tee /dev/stderr | grep -q '^MimeType=text/markdown'

  # The updater endpoint in tauri.conf.json points at a gist, so mirror the
  # latest.json that tauri-action attached to the release into that gist. Runs
  # once, after every platform has uploaded.
  update-gist:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download latest.json from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern latest.json \
            --output latest.json --clobber

      # Record each platform's download size. The app uses it for its progress
      # bar when a CDN or proxy omits Content-Length, which otherwise left the
      # bar frozen at 0% for the whole download. The updater ignores unknown
      # fields, so older installs still read this manifest.
      - name: Add download sizes to latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --json assets --jq '[.assets[] | {key: .name, value: .size}] | from_entries' > sizes.json
          jq --slurpfile sizes sizes.json '
            .platforms |= with_entries(
              .value.size = ($sizes[0][.value.url | split("/") | last] // null)
              | if .value.size == null then del(.value.size) else . end)
          ' latest.json > latest.sized.json
          mv latest.sized.json latest.json
          jq '.platforms | map_values(.size)' latest.json

      # Each platform job merges its entries into the release's latest.json, so
      # two jobs finishing together could drop one OS. Refuse to publish a
      # manifest that would leave an OS without updates.
      - name: Check every OS is in latest.json
        run: |
          for os in darwin linux windows; do
            jq -e --arg os "$os" '.platforms | keys | any(startswith($os))' latest.json > /dev/null \
              || { echo "::error::latest.json has no $os entries; re-run the $os build job"; exit 1; }
          done

      - name: Push latest.json to the updater gist
        env:
          # PAT with the `gist` scope — the default GITHUB_TOKEN cannot edit
          # user-owned gists.
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 47a3dee0bace9ff5134878f55d887157
        run: |
          jq -n --rawfile content latest.json \
            '{files: {"latest.json": {content: $content}}}' \
            | gh api -X PATCH "/gists/$GIST_ID" --input -

  # Point the Homebrew cask (Casks/sarala.rb on main) at the just-released macOS
  # .dmg by bumping its version + sha256. Runs once, after every platform has
  # uploaded, so the .dmg exists on the release.
  update-cask:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # commit the bump back onto main, not the detached tag

      - name: Bump the cask to the released version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "Sarala_${version}_universal.dmg" \
            --output sarala.dmg --clobber
          sha="$(shasum -a 256 sarala.dmg | awk '{print $1}')"
          rm -f sarala.dmg

          sed -i -E "s|^  version \".*\"|  version \"$version\"|" Casks/sarala.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"$sha\"|" Casks/sarala.rb

          if git diff --quiet -- Casks/sarala.rb; then
            echo "Cask already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sarala.rb
          git commit -m "Update Homebrew cask to $version"
          git push origin main
